<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大健康商城 · 智能导购</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f3f4f6;
      --bubble-bot: #ffffff;
      --text: #111827;
      --text-soft: #6b7280;
      --price: #e11d48;
      --border: #e5e7eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg); height: 100vh; display: flex; flex-direction: column; color: var(--text);
    }
    /* 顶部栏 */
    header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff; padding: 14px 22px; font-size: 16px; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 2;
    }
    header .logo {
      width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    header .sub { font-size: 12px; font-weight: 400; opacity: .85; margin-top: 2px; }
    header .hd-text { line-height: 1.2; }

    .meta {
      max-width: 820px; margin: 0 auto; padding: 8px 20px; font-size: 12px; color: var(--text-soft);
      display: flex; justify-content: center; gap: 14px; align-items: center; width: 100%;
    }
    .meta button {
      border: 1px solid var(--border); background: #fff; color: var(--primary);
      cursor: pointer; font-size: 12px; padding: 4px 12px; border-radius: 20px; transition: .15s;
    }
    .meta button:hover { background: #eff6ff; }

    #chat { flex: 1; overflow-y: auto; padding: 18px 16px 24px; max-width: 820px; margin: 0 auto; width: 100%; }

    /* 消息行：用户右、机器人左 */
    .msg { margin-bottom: 18px; display: flex; align-items: flex-start; gap: 10px; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .avatar.bot { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .avatar.user { background: #e5e7eb; }

    .bubble {
      max-width: 78%; padding: 12px 16px; border-radius: 16px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word; font-size: 14px;
    }
    .msg.user .bubble {
      background: var(--primary); color: #fff; border-top-right-radius: 5px;
      box-shadow: 0 2px 6px rgba(37,99,235,.25);
    }
    .msg.bot .bubble {
      background: var(--bubble-bot); color: var(--text); border-top-left-radius: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); min-width: 240px;
    }

    /* 开场白 / 引导提示（气泡内的段落） */
    .item-intro { font-size: 14px; color: #374151; font-weight: 600; margin: 2px 0 10px; }
    .item-clarify {
      font-size: 14px; line-height: 1.7; color: var(--primary-dark); font-weight: 500;
      margin: 4px 0 8px; border-left: 4px solid var(--primary); padding: 10px 12px;
      background: #eff6ff; border-radius: 8px;
    }

    /* 商品卡片（AI 端核心呈现） */
    .product-card {
      display: flex; gap: 12px; background: #fafafa; border: 1px solid #eef0f3;
      border-radius: 14px; padding: 12px; margin: 8px 0; align-items: flex-start;
    }
    .product-card .thumb {
      width: 84px; height: 84px; object-fit: cover; border-radius: 10px; background: #e5e7eb; flex-shrink: 0;
    }
    .product-card .noimg {
      width: 84px; height: 84px; border-radius: 10px; background: #e5e7eb; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 11px;
    }
    .product-card .body { flex: 1; min-width: 0; }
    .pc-title-row { display: flex; align-items: center; gap: 8px; }
    .pc-index {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
      background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .pc-title { font-weight: 700; font-size: 16px; color: #111827; line-height: 1.35; }
    .pc-price { color: var(--price); font-size: 15px; margin: 6px 0 4px; }
    .pc-reason { font-size: 13px; color: #4b5563; line-height: 1.6; margin-top: 4px; }
    .pc-intro { font-size: 12px; color: #9ca3af; line-height: 1.5; margin-top: 6px;
                border-top: 1px dashed #e5e7eb; padding-top: 6px; }
    .pc-intro .kv { margin: 1px 0; }

    /* 欢迎引导 */
    .welcome-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .welcome-desc { font-size: 13px; color: #4b5563; line-height: 1.7; margin-bottom: 8px; }
    .welcome-list { margin: 4px 0 8px; padding-left: 18px; }
    .welcome-list li { font-size: 13px; color: #4b5563; line-height: 1.8; }
    .example-label { font-size: 12px; color: var(--text-soft); margin: 8px 0 5px; }
    .example-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .example-chip {
      font-size: 12px; color: var(--primary); background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 14px; padding: 5px 12px; cursor: pointer; transition: .15s;
    }
    .example-chip:hover { background: #dbeafe; }

    /* 思考态 */
    .thinking { display: inline-flex; align-items: center; gap: 4px; color: #9ca3af; font-size: 13px; }
    .thinking .dot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: blink 1.2s infinite both; }
    .thinking .dot:nth-child(2) { animation-delay: .2s; }
    .thinking .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .product-card, .item-intro, .item-clarify { animation: fadeInUp .35s ease both; }

    /* 输入栏 */
    #input-bar {
      display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid var(--border);
      max-width: 820px; margin: 0 auto; width: 100%;
    }
    #input-bar input {
      flex: 1; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 22px; font-size: 14px;
      outline: none; transition: .15s;
    }
    #input-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    #input-bar button {
      padding: 0 22px; border: none; border-radius: 22px; background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s;
    }
    #input-bar button:hover:not(:disabled) { background: var(--primary-dark); }
    #input-bar button:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🛍️</div>
    <div class="hd-text">
      <div>大健康商城 · 智能导购助手</div>
      <div class="sub">基于商品知识库的检索增强推荐</div>
    </div>
  </header>
  <div class="meta">
    <span id="sid-label">会话 ID: -</span>
    <button onclick="resetSession()">新建会话</button>
  </div>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="q" type="text" placeholder="说说你的需求，如：推荐一款机械男士腕表" onkeydown="if(event.key==='Enter')send()" />
    <button id="send-btn" onclick="send()">发送</button>
  </div>

  <script>
    // 每个浏览器标签生成独立 session（C 端多用户隔离）
    function getSessionId() {
      let sid = localStorage.getItem("rag_sid");
      if (!sid) {
        sid = "web-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem("rag_sid", sid);
      }
      return sid;
    }
    let sessionId = getSessionId();
    document.getElementById("sid-label").textContent = "会话 ID: " + sessionId;

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("q");
    const sendBtn = document.getElementById("send-btn");

    function addBubble(role) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const avatar = document.createElement("div");
      avatar.className = "avatar " + role;
      avatar.textContent = role === "user" ? "🙂" : "🤖";
      const b = document.createElement("div");
      b.className = "bubble";
      wrap.appendChild(avatar);
      wrap.appendChild(b);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return b;
    }

    // 首次访问欢迎引导
    const EXAMPLES = [
      "预算 200 的墨镜，推荐 3 款",
      "送妈妈的生日礼物有什么推荐",
      "适合熬夜人群的保健服务",
      "价格 100 元以内的膏方",
    ];
    const WELCOME_TITLE = "👋 您好，我是您的智能导购助手";
    const WELCOME_DESC = "我可以根据您的需求，从商品库中为您检索并推荐相关商品，包含价格、推荐理由与配图。您可以这样问我：";
    const WELCOME_CAPS = [
      "按预算/价格筛选（如「预算 200 的墨镜」）",
      "按场景/人群推荐（如「送长辈的礼物」）",
      "指定数量（如「推荐 3 款」）",
      "结合类目与关键词（如「熬夜人群保健服务」）",
    ];

    async function showWelcome() {
      const bot = addBubble("bot");
      const title = document.createElement("div");
      title.className = "welcome-title";
      const desc = document.createElement("div");
      desc.className = "welcome-desc";
      bot.appendChild(title);
      bot.appendChild(desc);

      await typeWriter(title, WELCOME_TITLE, 45);
      await typeWriter(desc, WELCOME_DESC, 22);

      const ul = document.createElement("ul");
      ul.className = "welcome-list";
      WELCOME_CAPS.forEach((t) => {
        const li = document.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      const label = document.createElement("div");
      label.className = "example-label";
      label.textContent = "试试这些示例（点击即可发送）：";
      const chips = document.createElement("div");
      chips.className = "example-chips";
      EXAMPLES.forEach((ex) => {
        const chip = document.createElement("span");
        chip.className = "example-chip";
        chip.textContent = ex;
        chip.addEventListener("click", () => { inputEl.value = ex; send(); });
        chips.appendChild(chip);
      });
      [ul, label, chips].forEach((el) => bot.appendChild(el));
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // 商品顺序渲染队列
    let itemQueue = [];
    let renderRunning = false;
    let renderBubble = null;

    function typeWriter(element, text, speed) {
      return new Promise((resolve) => {
        element.textContent = "";
        let i = 0;
        const timer = setInterval(() => {
          if (i >= text.length) { clearInterval(timer); resolve(); return; }
          element.textContent += text[i++];
          chatEl.scrollTop = chatEl.scrollHeight;
        }, speed);
      });
    }

    // 解析商品 intro（JSON 或 KV 文本）为行数组
    function parseIntroLines(s) {
      const tryJson = () => {
        try { const o = JSON.parse(s); if (o && typeof o === "object") return Object.entries(o).map(([k,v]) => `${k}：${v}`); }
        catch (e) {}
        return null;
      };
      let lines = tryJson();
      if (lines) return lines;
      const re = /["']?([^"':，,{}\[\]]+?)["']?\s*[:：]\s*["']?([^"',，{}\[\]]+?)["']?(?=[,，]|$)/g;
      const m = s.match(re);
      if (m) return m.map((pair) => {
        const sep = pair.indexOf("：") >= 0 ? "：" : pair.indexOf(":") >= 0 ? ":" : null;
        if (!sep) return pair;
        const [k, v] = pair.split(sep);
        return `${k.trim()}：${v.trim()}`;
      });
      return [s];
    }

    async function renderItem(item) {
      const card = document.createElement("div");
      card.className = "product-card";
      card.dataset.id = item.id != null ? item.id : "";

      // 左侧缩略图
      if (item.image) {
        const wrap = document.createElement("div");
        wrap.style.opacity = "0";
        wrap.style.transition = "opacity .5s ease";
        const img = document.createElement("img");
        img.className = "thumb"; img.alt = item.title;
        let done = false;
        const finish = () => { if (!done) { done = true; wrap.style.opacity = "1"; } };
        img.onload = finish; img.onerror = finish;
        img.src = item.image;
        wrap.appendChild(img);
        card.appendChild(wrap);
        setTimeout(finish, 4000);
      } else {
        const noimg = document.createElement("div");
        noimg.className = "noimg"; noimg.textContent = "无图";
        card.appendChild(noimg);
      }

      const body = document.createElement("div");
      body.className = "body";

      const titleRow = document.createElement("div");
      titleRow.className = "pc-title-row";
      const badge = document.createElement("span");
      badge.className = "pc-index";
      badge.textContent = (item.index != null ? item.index : "?");
      const title = document.createElement("span");
      title.className = "pc-title";
      titleRow.appendChild(badge); titleRow.appendChild(title);

      const price = document.createElement("div");
      price.className = "pc-price";
      const reason = document.createElement("div");
      reason.className = "pc-reason";
      const introG = document.createElement("div");
      introG.className = "pc-intro";

      body.appendChild(titleRow);

      // 商品自身 intro：置于「标题正下方」（KV 展示）
      if (item.intro) {
        const lines = parseIntroLines(item.intro);
        lines.forEach((ln) => { const r = document.createElement("div"); r.className = "kv"; r.textContent = ln; introG.appendChild(r); });
        body.appendChild(introG);
      }

      body.appendChild(price);
      body.appendChild(reason);
      card.appendChild(body);
      renderBubble.appendChild(card);

      // 逐字：标题 -> 价格 -> 理由
      await typeWriter(title, item.title || "", 28);
      const priceText = (item.price_yuan != null) ? ("价格：" + "¥" + item.price_yuan) : "价格：价格未知";
      await typeWriter(price, priceText, 22);
      await typeWriter(reason, "推荐理由：" + (item.reason || ""), 14);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function drainQueue() {
      if (renderRunning) return;
      renderRunning = true;
      while (itemQueue.length) {
        const item = itemQueue.shift();
        await renderItem(item);
        await new Promise((r) => setTimeout(r, 250));
      }
      renderRunning = false;
    }
    function enqueueRender(data, bubble) {
      renderBubble = bubble;
      itemQueue.push(data);
      if (!renderRunning) drainQueue();
    }

    async function send() {
      const q = inputEl.value.trim();
      if (!q) return;
      inputEl.value = "";

      const userBubble = addBubble("user");
      const uSpan = document.createElement("div");
      uSpan.style.whiteSpace = "pre-wrap";
      uSpan.textContent = q;
      userBubble.appendChild(uSpan);

      const botBubble = addBubble("bot");
      const loading = document.createElement("div");
      loading.className = "thinking";
      loading.innerHTML = '思考中<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
      botBubble.appendChild(loading);
      sendBtn.disabled = true;
      let firstContent = false;
      itemQueue = []; renderRunning = false;

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, query: q }),
        });
        if (!resp.ok) { botBubble.textContent = "服务异常：" + resp.status; return; }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (data === "[DONE]") continue;
            let evt;
            try { evt = JSON.parse(data); } catch (e) { continue; }
            if (evt.type === "intro") {
              if (loading.parentNode) loading.remove();
              const intro = document.createElement("div");
              intro.className = "item-intro";
              intro.textContent = evt.data;
              botBubble.appendChild(intro);
            } else if (evt.type === "clarify") {
              if (loading.parentNode) loading.remove();
              const clarify = document.createElement("div");
              clarify.className = "item-clarify";
              clarify.textContent = evt.data;
              botBubble.appendChild(clarify);
            } else if (evt.type === "item_text") {
              if (!firstContent) { firstContent = true; if (loading.parentNode) loading.remove(); }
              enqueueRender(evt.data, botBubble);
            } else {
              if (loading.parentNode) loading.remove();
              const fallback = document.createElement("div");
              fallback.className = "item-intro";
              fallback.textContent = typeof evt.data === "string" ? evt.data : JSON.stringify(evt.data);
              botBubble.appendChild(fallback);
            }
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        }
      } catch (e) {
        if (loading.parentNode) loading.remove();
        botBubble.textContent = "连接失败：" + e.message;
      } finally {
        if (loading.parentNode) loading.remove();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function maybeShowWelcome() {
      const key = "welcomed_" + sessionId;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1");
      showWelcome();
    }
    function resetSession() {
      sessionId = "web-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("rag_sid", sessionId);
      document.getElementById("sid-label").textContent = "会话 ID: " + sessionId;
      chatEl.innerHTML = "";
      maybeShowWelcome();
    }
    maybeShowWelcome();
  </script>
</body>
</html>
